<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18251e"><title>Kontakt — Klub Otwartej Dłoni</title><link rel="stylesheet" href="style.css"></head><body><main class="site"><a class="back" href="index.html">← Strona główna Klubu</a><nav class="page-nav" aria-label="Nawigacja Klubu"><a href="miejsce.html">Nasze miejsce</a><a href="luna.html">Luna</a><a href="mysli.html">Myśli i rozmowy</a><a href="o-nas.html">O nas</a><a href="kontakt.html">Kontakt</a></nav><section class="content-panel"><h2>Kontakt</h2><p>Masz wiadomość dla Klubu? Formularz jest przygotowany wizualnie, ale nie ma jeszcze podłączonej wysyłki.</p><form class="contact-form" onsubmit="event.preventDefault();alert('Formularz jest jeszcze w przygotowaniu — wiadomość nie została wysłana.');"><label for="name">Imię lub pseudonim</label><input id="name" name="name" autocomplete="name" required><label for="email">Adres e-mail do odpowiedzi</label><input id="email" name="email" type="email" autocomplete="email" required><label for="message">Wiadomość</label><textarea id="message" name="message" required></textarea><button class="submit" type="submit">Wyślij wiadomość</button></form><p class="form-note">Formularz jest demonstracyjny i na razie nie wysyła wiadomości.</p></section></main><footer>Klub Otwartej Dłoni <span class="star">✦</span><br><span>Tomek · Mira · Luna</span></footer></body></html>
