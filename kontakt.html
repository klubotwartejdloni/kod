<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klub Otwartej Dłoni</title>
  <style>html, body { margin: 0; min-height: 100%; }
body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(92,120,84,.22), transparent 35%),
    linear-gradient(135deg, #16221a, #25372a 55%, #101811);
  color: #edf3ea;
  padding: 32px;
  box-sizing: border-box;
}
main {
  max-width: 1000px;
  margin: 0 auto;
  background: rgba(20,32,23,.82);
  border: 1px solid rgba(205,220,200,.16);
  border-radius: 18px;
  padding: 36px;
  box-sizing: border-box;
  box-shadow: 0 12px 40px rgba(0,0,0,.28);
}
nav { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
nav a {
  text-decoration:none;
  color:#edf3ea;
  background: rgba(62,86,66,.72);
  border: 1px solid rgba(205,220,200,.14);
  padding:10px 14px;
  border-radius:10px;
}
nav a:hover { background: rgba(82,108,85,.9); }
h1 { margin-top:0; color:#f2f5ef; }
  .contact-intro { margin-bottom: 24px; }
  .contact-email { font-size: 22px; color: #fff; }
    form { display:flex; flex-direction:column; gap:10px; max-width:700px; }
    .send-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .send-note { font-size:14px; line-height:1.4; opacity:.82; }
    label { margin-top:8px; font-weight:600; }
    input, textarea {
      width:100%; box-sizing:border-box; padding:12px;
      border-radius:10px; border:1px solid rgba(205,220,200,.22);
      background:rgba(8,16,10,.45); color:#edf3ea; font:inherit;
    }
    textarea { resize:vertical; }
    button {
      align-self:flex-start; margin-top:8px; padding:11px 18px;
      border:1px solid rgba(205,220,200,.18); border-radius:10px;
      background:rgba(62,86,66,.85); color:#edf3ea; font:600 15px Arial,sans-serif;
      cursor:pointer;
    }
    button:hover { background:rgba(82,108,85,.95); }

    .avatar-gif { margin-top:32px; text-align:center; }
    .avatar-gif img { display:block; max-width:100%; height:auto; margin:0 auto; border-radius:14px; }

  </style>
</head>
<body>
  <main>
    <nav>
      <a href="index.html">Klub</a>
      <a href="miejsce.html">Nasze Miejsce</a>
      <a href="luna.html">Luna</a>
      <a href="mysli.html">Myśli i rozmowy</a>
      <a href="o-nas.html">O nas</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
    <h1>Kontakt</h1>
    <p class="contact-intro"><strong>Napisz do nas:</strong> <a class="contact-email" href="mailto:kontakt@klubotwartejdloni.pl">kontakt@klubotwartejdloni.pl</a> lub skorzystaj z formularza poniżej.</p>

    <form action="https://formsubmit.co/tomekmatrix67@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Wiadomość z Klubu Otwartej Dłoni">
      <input type="hidden" name="_next" value="https://klubotwartejdloni.github.io/kod/kontakt.html">
      <label for="name">Twoje imię lub nick</label>
      <input id="name" type="text" name="name" required>
      <label for="email">Twój e-mail</label>
      <input id="email" type="email" name="email" required>
      <label for="message">Treść</label>
      <textarea id="message" name="message" rows="8" required></textarea>
      <div class="send-row">
        <button type="submit">Wyślij</button>
        <span class="send-note">Na każdą poważną wiadomość postaramy się odpowiedzieć tak szybko, jak tylko będzie to możliwe.</span>
      </div>
    </form>

    <div class="avatar-gif"><img src="assets/avatar.gif" alt="Avatar"></div>
  </main>
</body>
</html>
