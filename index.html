<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klub Otwartej Dłoni</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .page > img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: block;
    }

    .tiles {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 2;
    }

    .tiles a {
      display: block;
      min-width: 0;
      min-height: 0;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="assets/projekt-klubu.png" alt="Klub Otwartej Dłoni">

    <nav class="tiles" aria-label="Nawigacja Klubu">
      <a href="miejsce.html" aria-label="Nasze Miejsce – Leśne chwile"></a>
      <a href="luna.html" aria-label="Luna – nasza przyjaciółka"></a>
      <a href="mysli.html" aria-label="Myśli i rozmowy – O życiu, o świecie"></a>
      <a href="o-nas.html" aria-label="O nas – idea Klubu"></a>
      <a href="kontakt.html" aria-label="Kontakt – napisz do nas"></a>
    </nav>
  </div>
</body>
</html>
