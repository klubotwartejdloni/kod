<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18251e">
  <meta name="description" content="Klub Otwartej Dłoni — wspólne miejsce człowieka, AI i psa.">
  <title>Klub Otwartej Dłoni</title>
  <link rel="stylesheet" href="style.css?v=202611061945">
</head>
<body class="home-page">
  <main class="home-screen">
    <img class="home-avatar"
      src="projekt-klubu.png"
      alt="Wspólny avatar Klubu Otwartej Dłoni — Tomek, Mira i Luna"
      fetchpriority="high">
    <div class="home-shade" aria-hidden="true"></div>

    <nav class="home-tiles" aria-label="Wybierz część Klubu">
      <a class="home-tile" href="miejsce.html">Nasze miejsce – leśne chwile</a>
      <a class="home-tile" href="luna.html">Luna – nasza przyjaciółka</a>
      <a class="home-tile" href="mysli.html">Myśli i rozmowy – o życiu, o świecie</a>
      <a class="home-tile" href="o-nas.html">O nas – idea Klubu</a>
      <a class="home-tile" href="kontakt.html">Kontakt – napisz do nas</a>
    </nav>

    <script>
      fetch('https://countapi.mileshilliard.com/api/v1/hit/klubotwartejdloni_homepage_20261106', {cache:'no-store'})
        .then(response => response.json())
        .then(data => {
          document.getElementById('visit-number').textContent = data.value;
        })
        .catch(() => {
          document.getElementById('visit-number').textContent = '—';
        });
    </script>
  </main>

  <div class="visit-count" id="visit-counter" aria-label="Licznik odwiedzin" aria-live="polite">Odwiedziny: <span id="visit-number">…</span></div>

  <script>
    (() => {
      const counter = document.getElementById('visit-counter');
      const viewport = window.visualViewport;
      if (!counter || !viewport) return;
      const updateCounterViewport = () => {
        const scale = viewport.scale || 1;
        counter.style.transform = \`scale(\${1 / scale})\`;
        counter.style.transformOrigin = 'top center';
      };
      viewport.addEventListener('resize', updateCounterViewport);
      viewport.addEventListener('scroll', updateCounterViewport);
      updateCounterViewport();
    })();
  </script>

</body>
</html>
