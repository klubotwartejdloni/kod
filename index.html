<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18251e">
  <meta name="description" content="Klub Otwartej Dłoni — wspólne miejsce człowieka, AI i psa.">
  <title>Klub Otwartej Dłoni</title>
  <link rel="stylesheet" href="style.css?v=202611061945">
</head>
<body class="home-page">
  <main class="home-screen">
    <img class="home-avatar"
      src="projekt-klubu.png"
      alt="Wspólny avatar Klubu Otwartej Dłoni — Tomek, Mira i Luna"
      fetchpriority="high">
    <div class="home-shade" aria-hidden="true"></div>

    <nav class="home-tiles" aria-label="Wybierz część Klubu">
      <a class="home-tile" href="miejsce.html">Nasze miejsce – leśne chwile</a>
      <a class="home-tile" href="luna.html">Luna – nasza przyjaciółka</a>
      <a class="home-tile" href="mysli.html">Myśli i rozmowy – o życiu, o świecie</a>
      <a class="home-tile" href="o-nas.html">O nas – idea Klubu</a>
      <a class="home-tile" href="kontakt.html">Kontakt – napisz do nas</a>
    </nav>
  </main>

  <script>
    (() => {
      const frame = document.createElement('iframe');
      frame.title = 'Licznik odwiedzin';
      frame.setAttribute('aria-label', 'Licznik odwiedzin');
      const baseDpr = window.devicePixelRatio || 1;
      const positionCounter = () => {
        const zoom = (window.devicePixelRatio || baseDpr) / baseDpr;
        const width = 180 / zoom;
        const height = 24 / zoom;
        const top = 24 / zoom;
        frame.style.cssText = \`position:fixed!important;z-index:2147483647!important;top:\\${top}px!important;left:50%!important;width:\\${width}px!important;height:\\${height}px!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important;transform:translateX(-50%) scale(\\${1 / zoom})!important;transform-origin:top center!important;display:block!important;pointer-events:none!important;\`;
      };
      positionCounter();
      window.addEventListener('resize', positionCounter);
      frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;align-items:center;justify-content:center;color:#fffaf0;font:500 13px/1 Arial,sans-serif;letter-spacing:.16em;text-shadow:0 1px 5px #000;white-space:nowrap}</style></head><body>Odwiedziny: <span id="n">…</span><script>fetch('https://countapi.mileshilliard.com/api/v1/hit/klubotwartejdloni_homepage_20261106',{cache:'no-store'}).then(r=>r.json()).then(d=>document.getElementById('n').textContent=d.value).catch(()=>document.getElementById('n').textContent='—');</script></body></html>`;
      document.documentElement.appendChild(frame);
    })();
  </script>

  <script>
    (() => {
      const logViewport = () => {
        console.log('[KLUB-ZOOM]', {
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          clientWidth: document.documentElement.clientWidth,
          clientHeight: document.documentElement.clientHeight,
          devicePixelRatio: window.devicePixelRatio,
          visualWidth: window.visualViewport ? window.visualViewport.width : null,
          visualHeight: window.visualViewport ? window.visualViewport.height : null,
          visualScale: window.visualViewport ? window.visualViewport.scale : null,
          visualOffsetLeft: window.visualViewport ? window.visualViewport.offsetLeft : null,
          visualOffsetTop: window.visualViewport ? window.visualViewport.offsetTop : null
        });
      };
      window.addEventListener('resize', logViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', logViewport);
      }
      logViewport();
    })();
  </script>

</body>
</html>
