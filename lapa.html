<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test łapy — Klub Otwartej Dłoni</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .page > img.base {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: block;
    }

    /* Tylko obszar dłoni jest nakładany i poruszany.
       Reszta obrazu pozostaje całkowicie nieruchoma. */
    .paw-test {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: url("assets/projekt-klubu-lapa-test.png") 0 0 / 100% 100% no-repeat;
      pointer-events: none;
      mix-blend-mode: screen;
      clip-path: polygon(
        2.0% 0.0%,
        3.0% 1.5%,
        3.8% 0.0%,
        4.7% 0.0%,
        5.2% 5.0%,
        5.8% 9.5%,
        6.4% 0.0%,
        7.0% 0.0%,
        7.5% 4.0%,
        8.0% 0.0%,
        8.8% 0.0%,
        9.2% 8.0%,
        9.8% 0.0%,
        10.4% 0.0%,
        10.7% 10.0%,
        11.5% 16.0%,
        10.8% 22.0%,
        9.5% 27.0%,
        8.8% 30.0%,
        7.7% 30.5%,
        6.6% 28.5%,
        5.6% 25.0%,
        4.6% 22.0%,
        3.5% 19.0%,
        2.8% 15.0%,
        2.1% 11.0%,
        1.7% 7.0%
      );
      transform-origin: 7.0% 12%;
      animation: delikatne-machanie 1.44s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes delikatne-machanie {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      25% { transform: rotate(-1deg) translate(-1px, 0); }
      50% { transform: rotate(-1.8deg) translate(-2px, 1px); }
      75% { transform: rotate(1deg) translate(1px, 0); }
    }

    .tiles {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 2;
    }

    .tiles a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
      text-decoration: none;
      cursor: pointer;
      color: transparent;
      font: 600 15px/1.25 Arial, sans-serif;
      text-align: center;
      transform: translateY(22px);
    }

    .tiles a span {
      background: transparent;
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <img class="base" src="assets/projekt-klubu-lapa-test.png" alt="">
    <div class="paw-test" aria-hidden="true"></div>

    <nav class="tiles" aria-label="Nawigacja Klubu">
      <a href="miejsce.html" aria-label="Nasze Miejsce – Leśne chwile"><span>Nasze Miejsce<br>Leśne chwile</span></a>
      <a href="luna.html" aria-label="Luna – nasza przyjaciółka"><span>Luna<br>nasza przyjaciółka</span></a>
      <a href="mysli.html" aria-label="Myśli i rozmowy – O życiu, o świecie"><span>Myśli i rozmowy<br>O życiu, o świecie</span></a>
      <a href="o-nas.html" aria-label="O nas – idea Klubu"><span>O nas<br>idea Klubu</span></a>
      <a href="kontakt.html" aria-label="Kontakt – napisz do nas"><span>Kontakt<br>napisz do nas</span></a>
    </nav>
  </div>
</body>
</html>
