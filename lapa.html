<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test łapy — Klub Otwartej Dłoni</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    .page { position:relative; width:100vw; height:100vh; overflow:hidden; }
    .page > img.base { width:100vw; height:100vh; object-fit:fill; display:block; }

    .fire-overlay {
      position:absolute; left:-0.7vw; top:21.5vh; width:8.5vw; height:18vh;
      z-index:1; pointer-events:none; overflow:hidden; mix-blend-mode:screen;
    }
    .fire-overlay svg { width:100%; height:100%; display:block; }
    .flame { transform-origin:60px 185px; }
    .flame-a { fill:#ffd45a; animation:flameA 1.15s ease-in-out infinite alternate; }
    .flame-b { fill:#ff9f1c; animation:flameB 0.9s ease-in-out infinite alternate-reverse; }
    .flame-c { fill:#fff0a6; animation:flameC 1.35s ease-in-out infinite alternate; }
    @keyframes flameA { from { transform:translateX(-2px) scaleX(.94) scaleY(.96); opacity:.68; } to { transform:translateX(3px) scaleX(1.04) scaleY(1.04); opacity:.9; } }
    @keyframes flameB { from { transform:translateX(2px) scaleX(1.02) scaleY(.95); opacity:.55; } to { transform:translateX(-3px) scaleX(.92) scaleY(1.05); opacity:.82; } }
    @keyframes flameC { from { transform:translateX(-1px) scaleX(.9) scaleY(.92); opacity:.45; } to { transform:translateX(2px) scaleX(1.08) scaleY(1.08); opacity:.75; } }

    .tiles {
      position:absolute; left:0; right:0; bottom:0; height:32%;
      display:grid; grid-template-columns:repeat(5,1fr); z-index:2;
    }
    .tiles a {
      display:flex; align-items:center; justify-content:center; min-width:0; min-height:0;
      padding:12px; box-sizing:border-box; text-decoration:none; cursor:pointer;
      color:transparent; font:600 15px/1.25 Arial,sans-serif; text-align:center;
      transform:translateY(22px);
    }
    .tiles a span { background:transparent; border-radius:10px; padding:8px 10px; box-shadow:none; }
  </style>
</head>
<body>
  <div class="page">
    <img class="base" src="assets/projekt-klubu-lapa-test.png?v=5" alt="">
    <div class="fire-overlay" aria-hidden="true">
      <svg viewBox="0 0 120 190" preserveAspectRatio="none">
        <g class="flame flame-a"><path d="M60 185 C45 166 53 148 68 132 C62 112 78 98 88 78 C99 105 111 119 103 143 C99 158 89 172 82 185 Z"/></g>
        <g class="flame flame-b"><path d="M38 185 C25 166 34 151 48 137 C43 119 55 106 65 91 C72 112 83 126 75 148 C70 164 58 177 55 185 Z"/></g>
        <g class="flame flame-c"><path d="M78 185 C68 166 77 153 88 140 C84 122 96 108 105 94 C111 116 119 132 113 151 C108 167 98 177 94 185 Z"/></g>
      </svg>
    </div>

    <nav class="tiles" aria-label="Nawigacja Klubu">

      <a href="o-nas.html" aria-label="O nas – idea Klubu"><span>O nas<br>idea Klubu</span></a>
      <a href="kontakt.html" aria-label="Kontakt – napisz do nas"><span>Kontakt<br>napisz do nas</span></a>
    </nav>
  </div>
</body>
</html>
