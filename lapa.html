<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test łapy — Klub Otwartej Dłoni</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    .page { position:relative; width:100vw; height:100vh; overflow:hidden; }
    .page > img.base { width:100vw; height:100vh; object-fit:fill; display:block; }
    .paw-test {
      position:absolute;
      left:calc(35 / 2048 * 100vw);
      top:0;
      width:calc(177 / 2048 * 100vw);
      height:calc(183 / 1152 * 100vh);
      display:block;
      pointer-events:none;
      z-index:1;
    }
    .tiles {
      position:absolute; left:0; right:0; bottom:0; height:32%;
      display:grid; grid-template-columns:repeat(5,1fr); z-index:2;
    }
    .tiles a {
      display:flex; align-items:center; justify-content:center; min-width:0; min-height:0;
      padding:12px; box-sizing:border-box; text-decoration:none; cursor:pointer;
      color:transparent; font:600 15px/1.25 Arial,sans-serif; text-align:center;
      transform:translateY(22px);
    }
    .tiles a span { background:transparent; border-radius:10px; padding:8px 10px; box-shadow:none; }
  </style>
</head>
<body>
  <div class="page">
    <img class="base" src="assets/projekt-klubu-lapa-test.png?v=5" alt="">
    <img class="paw-test" src="assets/lapa-poprawiona.gif?v=2" alt="" aria-hidden="true">
    <nav class="tiles" aria-label="Nawigacja Klubu">
      <a href="miejsce.html" aria-label="Nasze Miejsce – Leśne chwile"><span>Nasze Miejsce<br>Leśne chwile</span></a>
      <a href="luna.html" aria-label="Luna – nasza przyjaciółka"><span>Luna<br>nasza przyjaciółka</span></a>
      <a href="mysli.html" aria-label="Myśli i rozmowy – O życiu, o świecie"><span>Myśli i rozmowy<br>O życiu, o świecie</span></a>
      <a href="o-nas.html" aria-label="O nas – idea Klubu"><span>O nas<br>idea Klubu</span></a>
      <a href="kontakt.html" aria-label="Kontakt – napisz do nas"><span>Kontakt<br>napisz do nas</span></a>
    </nav>
  </div>
</body>
</html>
